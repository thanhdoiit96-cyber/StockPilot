x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_analyst}
      POSTGRES_USER: ${POSTGRES_USER:-stock_analyst_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_analyst_user -d stock_analyst"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    logging: *default-logging
    environment:
      VNSTOCK_WORKER_HOST: 0.0.0.0
      VNSTOCK_WORKER_PORT: 8787
      VNSTOCK_WORKER_MAX_CONCURRENCY: 1
      VNSTOCK_TELEMETRY: "off"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-stock_analyst}
      DB_USER: ${POSTGRES_USER:-stock_analyst_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      CORS_ORIGIN: http://localhost:5173
      VNSTOCK_WORKER_URL: http://worker:8787
      READINESS_REQUIRE_WORKER: "true"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["sh", "-c", "npm run migrate && npm start"]
  exit-guidance-worker:
    build: ./backend
    profiles: ["exit-guidance-observe"]
    restart: unless-stopped
    init: true
    stop_grace_period: 75s
    logging: *default-logging
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-stock_analyst}
      DB_USER: ${POSTGRES_USER:-stock_analyst_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      EXIT_GUIDANCE_EOD_WORKER_ENABLED: "true"
      EXIT_GUIDANCE_EOD_OWNER_ID: ${EXIT_GUIDANCE_EOD_OWNER_ID:-}
      EXIT_GUIDANCE_EOD_LEASE_KEY: position-exit-eod:vnstock:position_exit_rule_v1
      EXIT_GUIDANCE_EOD_LEASE_MS: "60000"
    depends_on:
      backend:
        condition: service_healthy
    command: ["sh", "-c", "test -n \"$$EXIT_GUIDANCE_EOD_OWNER_ID\" || { echo 'EXIT_GUIDANCE_EOD_OWNER_ID is required'; exit 78; }; exec npm run run:exit-guidance-lease-worker"]
  frontend:
    build: ./frontend
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    logging: *default-logging
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  postgres_data:
