services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: stock_analyst
      POSTGRES_USER: stock_analyst_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_analyst_user -d stock_analyst"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: stock_analyst
      DB_USER: stock_analyst_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npm run migrate && npm start"]
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:5000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data:
