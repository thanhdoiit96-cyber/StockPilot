services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_analyst
      POSTGRES_USER: stock_analyst_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_analyst_user -d stock_analyst"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    init: true
    environment:
      VNSTOCK_WORKER_HOST: 0.0.0.0
      VNSTOCK_WORKER_PORT: 8787
      VNSTOCK_WORKER_MAX_CONCURRENCY: 1
      VNSTOCK_TELEMETRY: "off"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: stock_analyst
      DB_USER: stock_analyst_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      CORS_ORIGIN: http://localhost:5173
      VNSTOCK_WORKER_URL: http://worker:8787
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["sh", "-c", "npm run migrate && npm start"]
  frontend:
    build: ./frontend
    restart: unless-stopped
    init: true
    environment:
      API_PROXY_TARGET: http://backend:5000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  postgres_data:
