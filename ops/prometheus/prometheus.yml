global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: stockpilot-backend
    metrics_path: /api/ops/metrics/prometheus
    scheme: http
    static_configs:
      - targets: ['backend:5000']
    bearer_token_file: /run/secrets/metrics_api_key

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
